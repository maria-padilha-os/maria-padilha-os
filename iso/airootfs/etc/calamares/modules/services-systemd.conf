---
# Enable the units the installed Maria Padilha desktop expects.  The live
# image already uses greetd; enabling it here gives the target the same
# graphical login instead of a text console.
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "bluetooth.service"
      action: "enable"
      mandatory: false
    - name: "greetd.service"
      action: "enable"
      mandatory: false
    - name: "graphical.target"
      action: "enable"
      mandatory: false
