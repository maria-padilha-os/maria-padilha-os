---
# Enable the units the installed Maria Padilha desktop expects.  The live
# image already uses greetd; enabling it here gives the target the same
# graphical login instead of a text console.  seatd and power-profiles-daemon
# are part of the live root and are carried into the target by unpackfs.
#
# PipeWire is a *user* service stack, so it is not listed here.  The global
# /etc/systemd/user/default.target.wants and sockets.target.wants links in
# airootfs enable pipewire, pipewire-pulse and wireplumber for every user at
# login.
units:
    - name: "NetworkManager.service"
      action: "enable"
      mandatory: true
    - name: "bluetooth.service"
      action: "enable"
      mandatory: false
    - name: "seatd.service"
      action: "enable"
      mandatory: false
    - name: "power-profiles-daemon.service"
      action: "enable"
      mandatory: false
    - name: "greetd.service"
      action: "enable"
      mandatory: true
    - name: "graphical.target"
      action: "enable"
      mandatory: false
