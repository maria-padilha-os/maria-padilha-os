---
# Offline package installation.  The pacman backend runs inside the target
# chroot.  The shellprocess job before this module links the local repository
# database into /var/lib/pacman/sync and adds the file:// server below to the
# target's pacman.conf:
#
#   [maria-padilha-offline]
#   SigLevel = Optional DatabaseOptional
#   Server = file:///var/cache/calamares/offline-repo
#
# update_db and update_system are false so pacman never contacts a mirror.
# skip_if_no_internet is false because internet is not required at all.  No
# online package source is offered.
backend: pacman
skip_if_no_internet: false
update_db: false
ignore_update_db_error: false
update_system: false

pacman:
    num_retries: 0
    disable_download_timeout: false
    needed_only: true

operations:
    # Mandatory base group.  The packagechooser also lists these packages, but
    # a chooser item can be unselected.  Installing the base here guarantees
    # that the desktop, session, shell and hardware packages are present even
    # if the user clears every optional selection.  Keep this list in sync with
    # the *base* item in packagechooser.conf.
    - install:
        # Base system, kernel and boot
        - base
        - linux
        - mkinitcpio-archiso
        - plymouth
        - bash
        # CPU microcode, firmware and graphics
        - amd-ucode
        - intel-ucode
        - linux-firmware
        - linux-firmware-amd
        - linux-firmware-amdgpu
        - linux-firmware-atheros
        - linux-firmware-broadcom
        - linux-firmware-intel
        - linux-firmware-mediatek
        - linux-firmware-realtek
        - mesa
        - vulkan-radeon
        - libva
        - libva-utils
        # Networking, Bluetooth and laptop hardware
        - networkmanager
        - wpa_supplicant
        - wireless-regdb
        - iw
        - bluez
        - bluez-utils
        - seatd
        - power-profiles-daemon
        - upower
        - lm_sensors
        - acpi
        - pciutils
        - usbutils
        # Audio
        - pipewire
        - pipewire-pulse
        - pipewire-alsa
        - wireplumber
        - alsa-utils
        - alsa-ucm-conf
        - sof-firmware
        - pavucontrol
        # Hyprland, Quickshell and the Maria Padilha session
        - hyprland
        - quickshell
        - qt6-base
        - qt6-declarative
        - qt6-wayland
        - qt6-svg
        - xdg-desktop-portal
        - xdg-desktop-portal-hyprland
        - xdg-desktop-portal-gtk
        - xdg-utils
        - xdg-user-dirs
        - polkit
        - polkit-gnome
        - gnome-keyring
        - gsettings-desktop-schemas
        - hyprlock
        - hypridle
        - hyprsunset
        - playerctl
        - grim
        - slurp
        - swappy
        - wl-clipboard
        - cliphist
        - fuzzel
        - brightnessctl
        - jq
        - micro
        # Fonts used by the desktop and shell
        - ttf-jetbrains-mono-nerd
        - ttf-nerd-fonts-symbols
        - noto-fonts
        - noto-fonts-emoji
        - otf-font-awesome
        - ttf-dejavu
        # Login, privilege escalation and the desktop package
        - greetd
        - greetd-tuigreet
        - sudo
        - maria-padilha

    # Needed by the bootloader job, which runs after this module.
    - install:
        - grub
        - efibootmgr
