---
# Offline package installation.  The pacman backend runs inside the target
# chroot.  The shellprocess job before this module links the local repository
# database into /var/lib/pacman/sync and adds the file:// server below to the
# target's pacman.conf:
#
#   [maria-padilha-offline]
#   SigLevel = Optional DatabaseOptional
#   Server = file:///var/cache/calamares/offline-repo
#
# update_db and update_system are false so pacman never contacts a mirror.
# skip_if_no_internet is false because internet is not required at all.
backend: pacman
skip_if_no_internet: false
update_db: false
ignore_update_db_error: false
update_system: false

pacman:
    num_retries: 0
    disable_download_timeout: false
    needed_only: true

operations:
    # Needed by the bootloader job, which runs after this module.
    - install:
        - grub
        - efibootmgr
