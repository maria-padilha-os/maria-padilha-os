---
# Copy the live root's squashfs to the target.  This carries the base system
# and the offline package repository; the packages module then only installs
# the selected groups and the bootloader.
unpack:
    -   source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
        weight: 10
