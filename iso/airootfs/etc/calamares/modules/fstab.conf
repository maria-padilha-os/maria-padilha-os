---
# The target uses standard ext4/fat32 entries.  No encrypted root is offered,
# so crypttab is only kept for completeness.
crypttabOptions: luks

tmpOptions:
    default:
        tmpfs: false
        options: ""
    ssd:
        tmpfs: true
        options: "defaults,noatime,mode=1777"
