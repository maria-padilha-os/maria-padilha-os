---
# Partitioning defaults for the Maria Padilha ISO.
#
# ext4 is the only offered filesystem and the automatic default.  LUKS is
# disabled on purpose: this image does not ship cryptsetup, a LUKS-aware GRUB
# configuration or an initramfs hook for encrypted root.  Advertising
# encryption without those pieces would create an unbootable target.  Enable
# it only after the image carries and tests that support.
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

userSwapChoices:
    - none
    - small

defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]

enableLuksAutomatedPartitioning: false
preCheckEncryption: false

lvm:
    enable: false

initialPartitioningChoice: none
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
