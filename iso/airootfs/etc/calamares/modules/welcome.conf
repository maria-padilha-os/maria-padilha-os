---
# Welcome page requirements.  The ISO is intentionally installable without a
# network: no "internet" probe is configured or required.  GeoIP is disabled
# for the same reason (it would try to contact a remote service).
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    requiredStorage: 8.0
    requiredRam: 2.0
    check:
        - storage
        - ram
        - power
    required:
        - storage
        - ram

geoip:
    style: "none"
