---
# Software groups for the offline Maria Padilha install.
#
# method: packages hands the selected package lists to the packages module
# later in the exec phase.  Every archive comes from the ISO-local repository,
# so selecting or unselecting a group never contacts a mirror.  No online
# package source is offered.
#
# The base group is mandatory.  It is preselected here and also installed by
# the fixed operations in packages.conf, so unselecting it in this list-view
# cannot remove the desktop, session, shell or hardware packages.  Optional
# groups are additive only: packages.conf has no remove operations.
mode: optionalmultiple
method: packages
default: base

labels:
    step: "Software"

items:
    - id: base
      name: "Base system (required)"
      description: >-
          The Maria Padilha desktop, Hyprland/Quickshell session, greetd login,
          shell, networking, audio and all required laptop hardware packages.
          This group is always installed from the ISO and cannot be removed by
          the optional groups.
      screenshot: "logo.svg"
      packages:
          # Base system, kernel and boot
          - base
          - linux
          - mkinitcpio-archiso
          - plymouth
          - bash
          # CPU microcode, firmware and graphics
          - amd-ucode
          - intel-ucode
          - linux-firmware
          - linux-firmware-amd
          - linux-firmware-amdgpu
          - linux-firmware-atheros
          - linux-firmware-broadcom
          - linux-firmware-intel
          - linux-firmware-mediatek
          - linux-firmware-realtek
          - mesa
          - vulkan-radeon
          - libva
          - libva-utils
          # Networking, Bluetooth and laptop hardware
          - networkmanager
          - wpa_supplicant
          - wireless-regdb
          - iw
          - bluez
          - bluez-utils
          - seatd
          - power-profiles-daemon
          - upower
          - lm_sensors
          - acpi
          - pciutils
          - usbutils
          # Audio
          - pipewire
          - pipewire-pulse
          - pipewire-alsa
          - wireplumber
          - alsa-utils
          - alsa-ucm-conf
          - sof-firmware
          - pavucontrol
          # Hyprland, Quickshell and the Maria Padilha session
          - hyprland
          - quickshell
          - qt6-base
          - qt6-declarative
          - qt6-wayland
          - qt6-svg
          - xdg-desktop-portal
          - xdg-desktop-portal-hyprland
          - xdg-desktop-portal-gtk
          - xdg-utils
          - xdg-user-dirs
          - polkit
          - polkit-gnome
          - gnome-keyring
          - gsettings-desktop-schemas
          - hyprlock
          - hypridle
          - hyprsunset
          - playerctl
          - grim
          - slurp
          - swappy
          - wl-clipboard
          - cliphist
          - fuzzel
          - brightnessctl
          - jq
          - micro
          # Fonts used by the desktop and shell
          - ttf-jetbrains-mono-nerd
          - ttf-nerd-fonts-symbols
          - noto-fonts
          - noto-fonts-emoji
          - otf-font-awesome
          - ttf-dejavu
          # Login, privilege escalation and the desktop package
          - greetd
          - greetd-tuigreet
          - sudo
          - maria-padilha

    - id: development
      name: "Development tools"
      description: >-
          Compiler toolchain, git, Neovim, Python, Node.js, Rust, Go and
          debugging tools from the offline repository.  Optional: the base
          install does not include a compiler toolchain.
      screenshot: "logo.svg"
      packages:
          - base-devel
          - git
          - neovim
          - python
          - python-pip
          - nodejs
          - npm
          - rust
          - go
          - clang
          - cmake
          - ninja
          - gdb

    - id: media
      name: "Media"
      description: >-
          Video and audio playback, GStreamer codecs, image editing and
          recording tools from the offline repository.  This installs software
          only; it does not configure media accounts, streaming logins or
          codec licences.
      screenshot: "logo.svg"
      packages:
          - vlc
          - mpv
          - ffmpeg
          - gst-plugins-base
          - gst-plugins-good
          - gst-plugins-bad
          - gst-plugins-ugly
          - gst-libav
          - imagemagick
          - gimp
          - obs-studio
          - yt-dlp

    - id: games
      name: "Games"
      description: >-
          Native games and gaming utilities from the offline repository.
          Optional; selecting this group does not configure game-store
          accounts, launcher logins or Proton/Steam libraries.
      screenshot: "logo.svg"
      packages:
          - 0ad
          - supertuxkart
          - luanti
          - lutris
          - wine
          - gamemode
          - mangohud
          - vulkan-tools

    - id: office-mail
      name: "Office and Mail"
      description: >-
          LibreOffice, Thunderbird and spelling tools from the offline
          repository.  Selecting this group only installs software: it does not
          configure mail accounts, calendars, address books, online services or
          any credentials.
      screenshot: "logo.svg"
      packages:
          - libreoffice-fresh
          - thunderbird
          - hunspell-en_us
          - hyphen-en
          - mythes-en

    - id: ai-tools
      name: "AI Tools"
      description: >-
          The local assistant runtime (Ollama and llama.cpp) from the offline
          repository.  Selecting this group installs the runtime only: no API
          key, provider account, credential or model download is included or
          configured.  Models and any online provider setup remain a user
          decision after installation.
      screenshot: "logo.svg"
      packages:
          - ollama
          - llama-cpp
