---
# Optional software groups.  method: packages hands the selected package
# lists to the packages module later in the exec phase.  The packages are
# staged in the ISO's local repository, so selecting a group never touches
# the network.
mode: optionalmultiple
method: packages
default: desktop

labels:
    step: "Software"

items:
    - id: desktop
      packages: [ maria-padilha ]
      name: "Maria Padilha desktop"
      description: "The Hyprland + Quickshell session, Maria Padilha commands and the tracked defaults. Already present in the live root; selecting it verifies the installed copy."
      screenshot: "logo.svg"
    - id: development
      packages: [ base-devel, git, neovim ]
      name: "Development tools"
      description: "Compiler toolchain, git and Neovim from the offline repository. This is optional; the base install does not include a compiler."
      screenshot: "logo.svg"
