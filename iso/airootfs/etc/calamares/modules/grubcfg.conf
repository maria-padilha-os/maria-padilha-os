---
# Write a minimal /etc/default/grub for the GRUB bootloader module.  The
# Maria Padilha name comes from branding.desc (bootloaderEntryName).
#
# GRUB_TERMINAL_OUTPUT is deliberately not pinned to "console": the installed
# target uses the repository's gfxterm theme and needs GRUB's graphical
# terminal.  GRUB falls back to the console automatically if gfxterm cannot
# initialise, so the menu remains readable either way.
overwrite: false
prefer_grub_d: false
keep_distributor: false

kernel_params: [ "quiet", "splash" ]

defaults:
    GRUB_TIMEOUT: 5
    GRUB_TIMEOUT_STYLE: "menu"
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true
    GRUB_GFXMODE: "1920x1080,auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_THEME: "/boot/grub/themes/maria-padilha/theme.txt"
    GRUB_BACKGROUND: "/boot/grub/themes/maria-padilha/background.png"
    GRUB_COLOR_NORMAL: "light-gray/black"
    GRUB_COLOR_HIGHLIGHT: "black/red"

always_use_defaults: false
