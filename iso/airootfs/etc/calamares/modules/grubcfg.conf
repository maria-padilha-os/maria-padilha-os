---
# Write a minimal /etc/default/grub for the GRUB bootloader module.  The
# Maria Padilha name comes from branding.desc (bootloaderEntryName).
overwrite: false
prefer_grub_d: false
keep_distributor: false

kernel_params: [ "quiet" ]

defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: true
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true

always_use_defaults: false
