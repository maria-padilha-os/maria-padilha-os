---
# Arch/Calamares stores the X11 keyboard layout in this file.
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"

# xkb keymaps converted for the console.
convertedKeymapPath: "/usr/share/kbd/keymaps/xkb"

# Use the locale chosen on the locale page as the initial layout guess.
guessLayout: true

configure:
    kwin: false
    gnome: false
