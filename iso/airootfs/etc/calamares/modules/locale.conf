---
# Calamares has no separate timezone module: the locale module owns both the
# language/locale choices and the timezone picked on its map.  region/zone set
# the initial pin; the user can change it before installation.
region: "America"
zone: "Sao_Paulo"

# Keep the live clock in sync with the map while the installer is open.
adjustLiveTimezone: true

# No GeoIP: it requires a working network connection and this ISO must install
# offline.  Commenting the whole geoip block disables the lookup.
# geoip:
#     style: "none"
