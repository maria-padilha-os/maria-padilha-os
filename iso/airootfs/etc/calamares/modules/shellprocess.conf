---
# Runs inside the target before the users and packages modules.  The first
# helper removes the live-only account and autologin from the unpacked root so
# Calamares can create the real user with the freed UID.  The second links the
# ISO's local repository database into the target pacman sync directory and
# appends the file:// server stanza, so the following pacman calls never need a
# mirror.
dontChroot: false
timeout: 120
verbose: false

script:
    - "/usr/local/bin/maria-padilha-calamares-first-boot"
    - "/usr/local/bin/maria-padilha-calamares-offline"
