---
# Runs inside the target before the packages module.  It links the ISO's local
# repository database into the target pacman sync directory and appends the
# file:// server stanza, so the following pacman calls never need a mirror.
dontChroot: false
timeout: 60
verbose: false

script:
    - "/usr/local/bin/maria-padilha-calamares-offline"
