---
# One desktop user, created with sudo rights through wheel.  Root keeps its
# own password so the installed system is not left with a locked root account.
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - network
    - storage
    - audio
    - name: wheel
      must_exist: false
      system: true

sudoersGroup: wheel
setRootPassword: true
doReusePassword: false

displayAutologin: false
doAutologin: false

passwordRequirements:
    minLength: 8
    maxLength: 64
    libpwquality:
        - minlen=8
        - maxrepeat=3
        - maxsequence=3

user:
    shell: /bin/bash
    forbidden_names: [ root ]
    home_permissions: "o700"

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "maria-${first}"
    forbidden_names: [ localhost ]

presets:
    fullName:
        value: "Maria Padilha"
        editable: true
    loginName:
        value: "maria"
        editable: true
