---
# GRUB is used for both UEFI and BIOS installs.  The ISO live root does not
# need GRUB, but the target does, so grub/efibootmgr are installed from the
# local offline repository by packages.conf before this module runs.
efiBootLoader: "grub"
efiBootloaderId: "maria-padilha"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

loaderEntries:
    - "timeout 5"
    - "console-mode max"

kernelParams: [ "quiet", "splash" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true
installHybridGRUB: false
