#
# Calamares sequence for the Maria Padilha offline ISO.
#
# The installer never fetches the base system: the target root comes from the
# ISO's squashfs (unpackfs) and the packages module talks to the local
# repository staged under /var/cache/calamares/offline-repo.  Keep the
# packages module before bootloader so grub/efibootmgr are available when the
# bootloader job runs.
---
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - packagechooser
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - locale
  - keyboard
  - localecfg
  - fstab
  - initcpiocfg
  - initcpio
  - users
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess
  - packages
  - grubcfg
  - bootloader
  - umount
- show:
  - finished

branding: maria-padilha

# This is a real installer, not a post-install setup tool.
prompt-install: true
dont-chroot: false
oem-setup: false

disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
