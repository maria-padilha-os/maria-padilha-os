#
# s2idle is known broken on the reference AMD laptop: the machine does not
# resume, so the image does not offer suspend or hibernation at all.  This also
# makes an accidental automatic suspend impossible on that hardware.
#
# Revisit this file only after suspend/resume has been fixed and tested on the
# reference machine.  Never enable it as a workaround for an unrelated bug.
# See docs/supported-hardware.md.

[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
