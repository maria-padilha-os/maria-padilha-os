#
# The reference AMD laptop cannot resume from s2idle.  Do not let the lid,
# the suspend key or an idle timeout put it to sleep automatically.  This is a
# system-wide policy; users can still lock the session with their compositor.
#
# Suspend and hibernation are disabled as a whole in sleep.conf.d because a
# manual request would hit the same broken s2idle path.  See
# docs/supported-hardware.md.

[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
IdleAction=ignore
