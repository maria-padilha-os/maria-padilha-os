[terminal]
vt = 1

# The live image goes straight into the Maria Padilha session as the
# unprivileged live user. Logging out drops back to the themed greeter, which
# lists the Maria Padilha session installed by the maria-padilha package.
[initial_session]
command = "hyprland"
user = "maria"

# The Quickshell greeter runs under cage. The wrapper falls back to the
# themed tuigreet UI if cage or Quickshell cannot start, so a broken greeter
# never leaves the machine at a dead login screen.
[default_session]
command = "/usr/bin/padilha-greeter-qs"
user = "greeter"
