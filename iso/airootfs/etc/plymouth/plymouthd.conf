#
# Select the Maria Padilha graphical boot splash.  The theme and its assets
# live under /usr/share/plymouth/themes/maria-padilha and are copied into the
# initramfs by the plymouth mkinitcpio hook.
#
# ShowDelay=0 keeps the fallback background on screen for as little time as
# possible; DeviceTimeout=8 gives the DRM device time to appear on slow
# virtual machines without hanging the boot.
[Daemon]
Theme=maria-padilha
ShowDelay=0
DeviceTimeout=8
