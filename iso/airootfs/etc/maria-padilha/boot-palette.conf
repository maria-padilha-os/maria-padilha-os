#
# Maria Padilha boot and greeter palette.
#
# This is the static fallback used before the desktop has generated its own
# palette.  It follows the same candle-red seed as the shell:
#
#   seed       #b12e1b   candle red
#   background #120807   near-black
#   surface    #1a0d0b   raised near-black
#   text       #f3e6da   cream
#   accent     #d8a24a   candle gold
#
# The file is deliberately simple KEY="VALUE" data, not executable shell.
# The greeter wrapper reads only MARIA_PADILHA_GREETER_THEME from it, so a
# missing, truncated or malformed file cannot stop the greeter: the wrapper
# falls back to its own compiled-in copy of the same values below.
#
# A future palette pass may replace this file with the generated desktop
# palette.  Keep the six hex colours and the greeter theme in sync; the
# greeter uses ANSI names because tuigreet renders on a Linux virtual console.

MARIA_PADILHA_SEED="#b12e1b"
MARIA_PADILHA_BG="#120807"
MARIA_PADILHA_SURFACE="#1a0d0b"
MARIA_PADILHA_SURFACE_HIGH="#2a1310"
MARIA_PADILHA_PRIMARY="#b12e1b"
MARIA_PADILHA_GOLD="#d8a24a"
MARIA_PADILHA_TEXT="#f3e6da"
MARIA_PADILHA_TEXT_BRIGHT="#fff7ef"
MARIA_PADILHA_MUTED="#8d7567"

# container=background, border/title=red/gold, text=cream, prompt=red,
# action=gold.  These names are supported by tuigreet's --theme spec.
MARIA_PADILHA_GREETER_THEME="container=black;border=red;title=yellow;text=white;time=yellow;greet=white;prompt=red;input=white;action=yellow;button=white"
