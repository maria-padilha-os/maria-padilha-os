#
# pacman.conf for the Maria Padilha archiso profile.
#
# This file intentionally contains only the official Arch repositories. build.sh
# generates a temporary copy and appends:
#
#   [maria-padilha]
#   SigLevel = Optional DatabaseOptional
#   Server = file:///.../out/repo
#
# so the locally built maria-padilha package can be installed by mkarchiso
# without adding a machine-specific path to this tracked file.
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
# CheckSpace is disabled: pacstrap runs inside a chroot where this cannot work.
#CheckSpace
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# The testing repositories are intentionally disabled.
# [core-testing]
# Include = /etc/pacman.d/mirrorlist
# [extra-testing]
# Include = /etc/pacman.d/mirrorlist

# multilib is not needed by this desktop image.
# [multilib]
# Include = /etc/pacman.d/mirrorlist
