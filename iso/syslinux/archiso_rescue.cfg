# Rescue entry for the Maria Padilha live ISO.
#
# This boots the same kernel and squashfs as the live desktop, but asks the
# rescue unit to take over tty1 and start a root shell.  It deliberately does
# not start greetd or the graphical session: nothing is mounted, partitioned,
# formatted or repaired until the operator runs a command.
LABEL rescue
TEXT HELP
Boot the Maria Padilha rescue shell on tty1.
Includes filesystem checks, partition tools, arch-chroot,
GRUB/EFI bootloader repair. Nothing is changed automatically.
ENDTEXT
MENU LABEL Maria Padilha Rescue (BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% maria-padilha.rescue=1 systemd.unit=multi-user.target systemd.mask=getty@tty1.service plymouth.enable=0 %KERNEL_PARAMS%
