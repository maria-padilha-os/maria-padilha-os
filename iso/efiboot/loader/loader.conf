# systemd-boot has no pixmap/theme support.  Keep the menu text-only, legible
# at the highest available console resolution, and on the Maria Padilha
# entries.  The graphical candle treatment is provided by Plymouth after the
# kernel starts.
timeout 5
default 01-maria-padilha-linux.conf
console-mode max
editor no
auto-entries yes
auto-firmware yes
