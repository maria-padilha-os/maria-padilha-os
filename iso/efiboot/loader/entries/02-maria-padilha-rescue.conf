title    Maria Padilha Rescue (%ARCH%, UEFI)
sort-key 02
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% maria-padilha.rescue=1 systemd.unit=multi-user.target systemd.mask=getty@tty1.service plymouth.enable=0 %KERNEL_PARAMS%
